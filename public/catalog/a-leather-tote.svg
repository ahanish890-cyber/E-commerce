<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#f3ede2" />
    </linearGradient>
    <linearGradient id="leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#78350f" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#bg)" />
  <g transform="translate(110, 180)" filter="url(#shadow)">
    <!-- Bag Handles -->
    <path d="M120,130 C120,-30 260,-30 260,130" fill="none" stroke="#78350f" stroke-width="16" stroke-linecap="round"/>
    <path d="M130,130 C130,-15 250,-15 250,130" fill="none" stroke="#92400e" stroke-width="12" stroke-linecap="round"/>
    <!-- Bag Body -->
    <polygon points="50,120 330,120 360,450 20,450" fill="url(#leather)" rx="16" />
    <!-- Front Panel Detailing -->
    <polygon points="70,140 310,140 335,430 45,430" fill="#92400e" opacity="0.3" stroke="#b45309" stroke-width="2"/>
    <!-- Gold Hardware Fasteners -->
    <rect x="110" y="140" width="20" height="24" rx="4" fill="url(#gold)" />
    <rect x="250" y="140" width="20" height="24" rx="4" fill="url(#gold)" />
    <!-- Center Logo Emblem -->
    <circle cx="190" cy="220" r="10" fill="url(#gold)" />
    <!-- Zipper Top Trim -->
    <rect x="50" y="115" width="280" height="10" rx="3" fill="#451a03" />
  </g>
</svg>
