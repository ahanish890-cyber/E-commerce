<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="blackleather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="brownleather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#bg)" />
  <g transform="translate(100, 150)" filter="url(#shadow)">
    <!-- Coiled Belt Body Outer Loop -->
    <path d="M100,250 C100,100 300,100 300,250 C300,400 100,400 100,250" fill="none" stroke="url(#blackleather)" stroke-width="48" stroke-linecap="round"/>
    <!-- Stitching Along Edges -->
    <path d="M90,250 C90,85 310,85 310,250 C310,415 90,415 90,250" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
    
    <!-- Coiled Belt Inner Loop (Reversible Brown Side Peek) -->
    <path d="M150,250 C150,160 250,160 250,250 C250,340 150,340 150,250" fill="none" stroke="url(#brownleather)" stroke-width="44" stroke-linecap="round"/>

    <!-- Belt Holes -->
    <circle cx="100" cy="210" r="5" fill="#f8fafc" />
    <circle cx="100" cy="250" r="5" fill="#f8fafc" />
    <circle cx="100" cy="290" r="5" fill="#f8fafc" />

    <!-- Brushed Gunmetal Buckle -->
    <g transform="translate(230, 210)">
      <rect x="0" y="0" width="100" height="80" rx="12" fill="none" stroke="url(#metal)" stroke-width="16"/>
      <!-- Prong -->
      <line x1="5" y1="40" x2="80" y2="40" stroke="url(#metal)" stroke-width="12" stroke-linecap="round"/>
    </g>
  </g>
</svg>
