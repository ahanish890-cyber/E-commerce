<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="cotton" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#bg)" />
  <g transform="translate(140, 160)" filter="url(#shadow)">
    <!-- Romper Body -->
    <path d="M110,60 C130,75 190,75 210,60 L280,120 L240,160 L220,150 L230,360 L180,410 L160,380 L140,410 L90,360 L100,150 L80,160 L40,120 Z" fill="url(#cotton)" stroke="#0284c7" stroke-width="3"/>
    
    <!-- Lap Collar Expandable Neckline -->
    <path d="M100,60 C130,80 190,80 220,60" fill="none" stroke="#0369a1" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Cute Animal Chest Print -->
    <circle cx="160" cy="220" r="30" fill="#ffffff" opacity="0.9"/>
    <circle cx="150" cy="215" r="4" fill="#0369a1" />
    <circle cx="170" cy="215" r="4" fill="#0369a1" />
    <path d="M155,225 C160,230 165,230 170,225" fill="none" stroke="#0369a1" stroke-width="2" stroke-linecap="round"/>
    <!-- Cute Ears -->
    <circle cx="140" cy="195" r="10" fill="#ffffff" opacity="0.9"/>
    <circle cx="180" cy="195" r="10" fill="#ffffff" opacity="0.9"/>

    <!-- Bottom Snap Buttons -->
    <circle cx="140" cy="385" r="4" fill="#f8fafc" stroke="#0369a1" stroke-width="2"/>
    <circle cx="160" cy="385" r="4" fill="#f8fafc" stroke="#0369a1" stroke-width="2"/>
    <circle cx="180" cy="385" r="4" fill="#f8fafc" stroke="#0369a1" stroke-width="2"/>
  </g>
</svg>
