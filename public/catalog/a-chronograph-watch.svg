<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="dial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#bg)" />
  <g transform="translate(160, 100)" filter="url(#shadow)">
    <!-- Steel Bracelet / Strap Top -->
    <rect x="80" y="30" width="120" height="180" rx="10" fill="url(#steel)" />
    <!-- Steel Bracelet Links Lines -->
    <line x1="80" y1="70" x2="200" y2="70" stroke="#475569" stroke-width="3"/>
    <line x1="80" y1="110" x2="200" y2="110" stroke="#475569" stroke-width="3"/>
    <line x1="80" y1="150" x2="200" y2="150" stroke="#475569" stroke-width="3"/>

    <!-- Steel Bracelet Bottom -->
    <rect x="80" y="390" width="120" height="180" rx="10" fill="url(#steel)" />
    <line x1="80" y1="430" x2="200" y2="430" stroke="#475569" stroke-width="3"/>
    <line x1="80" y1="470" x2="200" y2="470" stroke="#475569" stroke-width="3"/>
    <line x1="80" y1="510" x2="200" y2="510" stroke="#475569" stroke-width="3"/>

    <!-- Case Watch Base -->
    <circle cx="140" cy="300" r="130" fill="url(#steel)" />
    <circle cx="140" cy="300" r="110" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
    
    <!-- Watch Dial -->
    <circle cx="140" cy="300" r="100" fill="url(#dial)" />

    <!-- Subdials -->
    <circle cx="105" cy="300" r="22" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="175" cy="300" r="22" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="140" cy="340" r="22" fill="#1e293b" stroke="#64748b" stroke-width="2"/>

    <!-- Hour Markers -->
    <line x1="140" y1="210" x2="140" y2="225" stroke="#f8fafc" stroke-width="4"/>
    <line x1="230" y1="300" x2="215" y2="300" stroke="#f8fafc" stroke-width="4"/>
    <line x1="140" y1="390" x2="140" y2="375" stroke="#f8fafc" stroke-width="4"/>
    <line x1="50" y1="300" x2="65" y2="300" stroke="#f8fafc" stroke-width="4"/>

    <!-- Watch Hands -->
    <line x1="140" y1="300" x2="175" y2="255" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
    <line x1="140" y1="300" x2="140" y2="240" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="140" y1="300" x2="120" y2="350" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <circle cx="140" cy="300" r="6" fill="#ef4444"/>

    <!-- Crown & Pushers -->
    <rect x="268" y="290" width="16" height="20" rx="3" fill="url(#steel)" />
    <rect x="260" y="250" width="14" height="14" rx="2" fill="url(#steel)" />
    <rect x="260" y="336" width="14" height="14" rx="2" fill="url(#steel)" />
  </g>
</svg>
